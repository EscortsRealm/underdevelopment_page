<!DOCTYPE html>
<html lang="en">
<head>
    <title>Technovate Digital - Leading IT & Software Services Company in India</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Technovate Digital offers comprehensive IT, ITEnabled Services (ITeS), and Software Services across India. Specializing in software development, IT services, BPO, technology consulting, and digital solutions in major tech hubs like Bengaluru, Hyderabad, and Delhi-NCR." />
    <meta name="keywords" content="IT Services, ITEnabled Services, Software Services, Technology Consulting, Digital Solutions, Software Development, BPO Services, IT Company India, Tech Solutions Bengaluru, Hyderabad IT Services, Delhi-NCR Technology, Technovate Digital" />
    <meta name="author" content="Technovate Digital" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Technovate Digital - IT & Software Services" />
    <meta property="og:description" content="Leading provider of IT, ITEnabled Services, and Software Solutions across India's major tech hubs." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.technovate.co.in" />
    <meta property="og:image" content="logo.png" />
    <link rel="canonical" href="https://www.technovate.co.in" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Rest of the existing head content including styles -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            padding: 20px;
        }

        .logo img {
            max-width: 150px;
            margin-bottom: 20px;
        }

        .content {
            max-width: 600px;
            margin: 0 auto;
        }

        .content h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #333;
            font-weight: 700;
        }

        .content p {
            font-size: 1.1em;
            margin-bottom: 20px;
            color: #666;
        }

        .footer-grids p {
            margin: 5px 0;
            color: #666;
        }

        .footer-grids a {
            color: #007bff;
            text-decoration: none;
        }

        .footer-grids a:hover {
            text-decoration: underline;
        }

        .social-links ul {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .social-links ul li {
            display: inline;
            margin: 0 10px;
        }

        .social-links ul li a {
            color: #007bff;
            font-size: 1.4em;
            text-decoration: none;
        }

        .social-links ul li a:hover {
            color: #0056b3;
        }

        .sub-form {
            margin-top: 20px;
        }

        .sub-form form {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .sub-form input[type="email"] {
            padding: 10px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            margin-bottom: 10px;
        }

        .sub-form button {
            padding: 5px 10px;
            background-color: #020f40;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9em;
        }

        .sub-form button:hover {
            background-color: #010b2e;
        }

        .footer {
            margin-top: 40px;
        }

        .footer p {
            font-size: 0.9em;
            color: #666;
        }

        .footer p a {
            color: #007bff;
            text-decoration: none;
        }

        .footer p a:hover {
            text-decoration: underline;
        }

        .logo {
            margin-top: 20px; /* Add space between the button and the logo */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <h1>Technovate Digital</h1>
            <p>Our website is coming soon. In the meantime, connect with us using the information below:</p>
            <div class="footer-grids">

                <p class="phone"><span class="fa fa-phone"></span> Phone: +91 8062649678, +91 8054232135</p>
                <p class="phone"><span class="fa fa-envelope"></span> Email: <a href="mailto:info@technovate.co.in">info@technovate.co.in</a></p>
            </div>
            <div class="social-links">
                <ul>
                    <li><a href="#"><span class="fa fa-facebook"></span></a></li>
                    <li><a href="#"><span class="fa fa-twitter"></span></a></li>
                    <li><a href="#"><span class="fa fa-linkedin"></span></a></li>
                    <li><a href="#"><span class="fa fa-instagram"></span></a></li>
                </ul>
            </div>
            <div class="sub-form">
                <form action="#" method="post">
                    <input type="email" name="email" size="30" required="" placeholder="Email">
                    <button class="btn1">
                        <span class="fa fa-paper-plane" aria-hidden="true"></span>
                        Subscribe
                    </button>
                </form>
            </div>
        </div>
        <div class="logo">
            <img src="logo.png" alt="Technovate Digital Logo">
        </div>
        <div class="footer">
            <p>&copy; 2024 Technovate Digital. All Rights Reserved.</p>
        </div>
    </div>
</body>

</html>
